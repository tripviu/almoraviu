name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (if script exists)
        run: npm run -s lint || echo "no lint script, skipping"

      - name: Type-check (if script exists)
        run: npm run -s type-check || echo "no type-check script, skipping"

      - name: Build
        run: npm run build
        env:
          CI: true
